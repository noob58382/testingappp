name: Apple Store Stock Monitor

on:
  workflow_dispatch:
    inputs:
      test_stock:
        description: "Test fake in-stock notification"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    - cron: "*/5 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Create config
        env:
          APPLE_CONFIG_JSON: ${{ secrets.APPLE_CONFIG_JSON }}
        run: |
          printf '%s' "$APPLE_CONFIG_JSON" > config.json

      - name: Run stock monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_STOCK: ${{ github.event.inputs.test_stock || 'false' }}
        run: |
          python monitor.py

      - name: Save notification state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state.json

            git diff --cached --quiet || git commit -m "Update stock monitor state"

            git push || true
          fi
